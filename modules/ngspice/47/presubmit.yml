matrix:
  platform:
  - ubuntu2404
  - macos
  - macos_arm64
  bazel:
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Build API library and CLI
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@ngspice//:ngspice'
    - '@ngspice//:ngspice_bin'
    - '@ngspice//:runtime'
bcr_test_module:
  module_path: bazel_test
  matrix:
    platform:
    - ubuntu2404
    - macos
    - macos_arm64
    bazel:
    - 8.x
    - 9.x
    xspice:
    - 'true'
    - 'false'
    openmp:
    - 'true'
    - 'false'
  tasks:
    default_features:
      name: Test API and CLI with XSPICE and OpenMP
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
      - '//:all'
    feature_combinations:
      name: Test XSPICE=${{ xspice }}, OpenMP=${{ openmp }}
      platform: ubuntu2404
      bazel: 9.x
      environment:
        CC: gcc
        CXX: g++
      test_flags:
      - '--@ngspice//:xspice=${{ xspice }}'
      - '--@ngspice//:openmp=${{ openmp }}'
      test_targets:
      - '//:all'
      - '//gcc_openmp:consumer'
    linux_clang:
      name: Test Linux Clang with XSPICE and OpenMP
      platform: ubuntu2404
      bazel: 9.x
      environment:
        CC: clang
        CXX: clang++
      test_flags:
      - '--@ngspice//:xspice=true'
      - '--@ngspice//:openmp=true'
      test_targets:
      - '//:all'
      - '//clang_openmp:consumer'
    macos_clang:
      name: Test OpenMP coexistence on macOS
      platform: macos_arm64
      bazel: 9.x
      test_targets:
      - '//clang_openmp:consumer'
